<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600">
  <title>A pelican riding a bicycle</title>
  <!-- Sky and ground -->
  <rect width="400" height="300" fill="#bfe6ff"/>
  <circle cx="345" cy="50" r="22" fill="#ffd84d"/>
  <rect y="268" width="400" height="32" fill="#7cc46a"/>
  <path d="M0 268 H400" stroke="#5a9e4b" stroke-width="2"/>

  <!-- Bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <g stroke="#222" stroke-width="5">
      <circle cx="115" cy="222" r="46"/>
      <circle cx="285" cy="222" r="46"/>
    </g>
    <g stroke="#888" stroke-width="1">
      <path d="M115 176 V268 M69 222 H161 M82 189 L148 255 M148 189 L82 255"/>
      <path d="M285 176 V268 M239 222 H331 M252 189 L318 255 M318 189 L252 255"/>
    </g>
    <!-- Frame -->
    <g stroke="#d6312b" stroke-width="6">
      <path d="M115 222 L195 222 L170 150 Z"/>
      <path d="M170 150 L262 150 L195 222"/>
      <path d="M262 150 L285 222"/>
    </g>
    <!-- Seat post, saddle, stem and handlebars -->
    <path d="M170 150 L166 138" stroke="#444" stroke-width="5"/>
    <path d="M150 136 Q166 130 182 136" stroke="#222" stroke-width="7"/>
    <path d="M262 150 L256 128" stroke="#444" stroke-width="5"/>
    <path d="M246 126 Q262 118 276 128" stroke="#222" stroke-width="5"/>
    <!-- Crank and pedals -->
    <circle cx="195" cy="222" r="9" fill="#555" stroke="#222" stroke-width="2"/>
    <path d="M195 222 L212 238 M195 222 L178 206" stroke="#444" stroke-width="4"/>
    <path d="M204 238 H220 M170 206 H186" stroke="#222" stroke-width="5"/>
    <!-- Hubs -->
    <circle cx="115" cy="222" r="4" fill="#222"/>
    <circle cx="285" cy="222" r="4" fill="#222"/>
  </g>

  <!-- Pelican -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Legs -->
    <g fill="none" stroke="#f29b30" stroke-width="5">
      <path d="M172 128 L196 176 L212 236"/>
      <path d="M162 130 L168 172 L178 204"/>
    </g>
    <path d="M204 238 l18 0 l-6 -6 M170 206 l18 0 l-6 -6" fill="none" stroke="#f29b30" stroke-width="3"/>
    <!-- Tail -->
    <path d="M128 112 L104 104 L110 120 L98 126 L130 128 Z" fill="#e8e8e8" stroke="#555" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="165" cy="112" rx="42" ry="28" fill="#fff" stroke="#555" stroke-width="2.5" transform="rotate(-12 165 112)"/>
    <!-- Wing reaching to handlebars -->
    <path d="M150 104 Q200 92 250 124 Q210 114 196 122 Q170 124 150 104 Z" fill="#dcdcdc" stroke="#555" stroke-width="2"/>
    <path d="M172 108 Q196 104 222 114 M180 116 Q200 112 218 118" fill="none" stroke="#999" stroke-width="1.5"/>
    <!-- Neck -->
    <path d="M190 96 Q210 70 198 48 Q192 36 204 28" fill="none" stroke="#555" stroke-width="18"/>
    <path d="M190 96 Q210 70 198 48 Q192 36 204 28" fill="none" stroke="#fff" stroke-width="14"/>
    <!-- Head -->
    <ellipse cx="210" cy="30" rx="16" ry="13" fill="#fff" stroke="#555" stroke-width="2.5"/>
    <path d="M200 20 Q206 12 214 18" fill="none" stroke="#f5d76e" stroke-width="3"/>
    <!-- Beak with pouch -->
    <path d="M222 26 L300 40 L294 46 Q260 72 232 52 Q224 44 222 36 Z" fill="#f7b733" stroke="#b5741a" stroke-width="2"/>
    <path d="M222 30 L298 42" fill="none" stroke="#b5741a" stroke-width="1.5"/>
    <path d="M296 38 l8 4 l-8 2 Z" fill="#e0662a"/>
    <!-- Eye -->
    <circle cx="213" cy="27" r="3.5" fill="#222"/>
    <circle cx="214" cy="26" r="1.2" fill="#fff"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M30 180 H60 M20 205 H55 M35 230 H62"/>
  </g>
</svg>
